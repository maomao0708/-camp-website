<!DOCTYPE html>
<html lang="ja">
<head>
  <title>数当てゲーム</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" >
  <style>
    #guessGame {
      margin: 20px;
    }

    #guessGame input {
      width: 200px;
    }
  </style>
</head>
<body>

<main class="container">
  <h1>数字を入れてボタンを押すと、大きい・小さい・正解を教えてくれるゲーム (1~30)</h1>
  
  <div id="guessGame">
    <label for="guessField">予想: </label>
    <input type="number" min="1" max="20" id="guessField">
    <input type="submit" value="予想を入力" id="guessSubmit">
    <p id="guessResult"></p>
    <button id="resetButton" style="display:none;">もう一度遊ぶ</button>
  </div>
</main>

<script>
  // 1から20までのランダムな整数を生成し、コンソールにログを出力
  let answerNumber = Math.floor(Math.random() * 30) + 1;
  console.log('正解は' + answerNumber);

  // 数値入力フィールドを取得
  let guessField = document.querySelector('#guessField');

  // submitボタンを取得
  let guessSubmit = document.querySelector('#guessSubmit');

  // 結果を表示する要素を取得
  let guessResult = document.querySelector('#guessResult');

  let resetButton = document.querySelector('#resetButton');

  function checkGuess() {
    let userGuess = Number(guessField.value);

    if (userGuess === answerNumber) {
      guessResult.textContent = '正解です！';
      guessSubmit.disabled = true;
      resetButton.style.display = 'inline';
    } else if (userGuess < answerNumber) {
      guessResult.textContent = 'もっと大きいです';
    } else if (userGuess > answerNumber) {
      guessResult.textContent = 'もっと小さいです';
    }
  }

  function resetGame() {
    answerNumber = Math.floor(Math.random() * 30) + 1;
    console.log('正解は' + answerNumber);
    guessField.value = '';
    guessResult.textContent = '';
    guessSubmit.disabled = false;
    resetButton.style.display = 'none';
  }

  // submitがクリックされたときに、checkGuess関数を呼び出す
  guessSubmit.addEventListener('click', checkGuess);
  resetButton.addEventListener('click', resetGame);
</script>

</body>
</html>
